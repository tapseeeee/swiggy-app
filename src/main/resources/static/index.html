<!DOCTYPE html>
<html>
<head>
<title>QuickBite - Food Delivery</title>

<style>
body {
    font-family: Arial;
    margin: 0;
    background: #f5f5f5;
}

header {
    background: #fc8019;
    color: white;
    padding: 15px;
    font-size: 22px;
    font-weight: bold;
}

.hero {
    background: linear-gradient(135deg, #fc8019, #b3541e);
    color: white;
    padding: 50px 20px;
    text-align: center;
}

.search-box {
    padding: 10px;
    width: 50%;
    border-radius: 8px;
    border: none;
}

.container {
    display: flex;
}

.menu {
    width: 70%;
    padding: 20px;
    height: 80vh;
    overflow-y: auto;
}

.cart {
    width: 30%;
    background: white;
    padding: 20px;
    height: 80vh;
    overflow-y: auto;
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.card {
    background: white;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 5px 10px rgba(0,0,0,0.1);
}

.card img {
    width: 100%;
    height: 140px;
    object-fit: cover;
}

.card-body {
    padding: 10px;
}

.price {
    color: green;
}

button {
    background: #fc8019;
    color: white;
    border: none;
    padding: 6px 10px;
    border-radius: 5px;
    cursor: pointer;
}

/* MOBILE */
@media (max-width: 768px) {
    .container {
        flex-direction: column;
    }
    .menu, .cart {
        width: 100%;
        height: auto;
    }
    .grid {
        grid-template-columns: 1fr;
    }
    .search-box {
        width: 90%;
    }
}
</style>
</head>

<body>

<header>🍔 QuickBite</header>

<div class="hero">
    <h1>Food Delivery</h1>
    <input type="text" id="search" class="search-box" placeholder="Search food..." onkeyup="filterFood()">
</div>

<div class="container">

<div class="menu">
    <button onclick="loadFood()">Show Menu</button>
    <div id="menu" class="grid"></div>
</div>

<div class="cart">
    <h3>🛒 Cart</h3>
    <div id="cartItems">No items</div>
    <h4>Total: ₹<span id="total">0</span></h4>
    <button onclick="placeOrder()">Place Order</button>
</div>

</div>

<script>

let cart = {};
let foodData = [];

const restaurants = {
  Pizza: "Pizza Hub",
  Burger: "Burger Palace",
  Fries: "Snack Corner",
  Pasta: "Italiano",
  Sandwich: "Quick Bites",
  Noodles: "Asian Delight",
  Biryani: "Hyderabadi House",
  IceCream: "Sweet Treats"
};

/* SAFE IMAGES */
const images = {
  Pizza: "https://via.placeholder.com/300?text=Pizza",
  Burger: "https://via.placeholder.com/300?text=Burger",
  Fries: "https://via.placeholder.com/300?text=Fries",
  Pasta: "https://via.placeholder.com/300?text=Pasta",
  Sandwich: "https://via.placeholder.com/300?text=Sandwich",
  Noodles: "https://via.placeholder.com/300?text=Noodles",
  Biryani: "https://via.placeholder.com/300?text=Biryani",
  IceCream: "https://via.placeholder.com/300?text=IceCream"
};

function loadFood(){
 fetch("/food")
 .then(res=>res.json())
 .then(data=>{
   foodData = data;
   displayFood(data);
 });
}

function displayFood(data){
 let menu=document.getElementById("menu");
 menu.innerHTML="";

 data.forEach(item=>{
   let div=document.createElement("div");
   div.className="card";

   div.innerHTML=`
    <img src="${images[item.name]}" />
    <div class="card-body">
        <small>${restaurants[item.name]}</small><br>
        <b>${item.name}</b><br>
        ⭐ 4.${Math.floor(Math.random()*9)}<br>
        <span class="price">₹${item.price}</span><br><br>
        <button onclick="add('${item.name}', ${item.price})">Add</button>
    </div>
   `;

   menu.appendChild(div);
 });
}

function filterFood(){
 let search=document.getElementById("search").value.toLowerCase();

 let filtered = foodData.filter(item => 
   item.name.toLowerCase().includes(search)
 );

 displayFood(filtered);
}

function add(name, price){
 if(!cart[name]) cart[name]={qty:0, price:price};
 cart[name].qty++;
 updateCart();
}

function remove(name){
 cart[name].qty--;
 if(cart[name].qty<=0) delete cart[name];
 updateCart();
}

function updateCart(){
 let cartDiv=document.getElementById("cartItems");
 cartDiv.innerHTML="";
 let total=0;

 if(Object.keys(cart).length===0){
   cartDiv.innerHTML="No items";
 }

 for(let item in cart){
   let div=document.createElement("div");
   div.innerHTML=`
     ${item} x ${cart[item].qty}
     <button onclick="add('${item}', ${cart[item].price})">+</button>
     <button onclick="remove('${item}')">-</button>
   `;
   cartDiv.appendChild(div);

   total += cart[item].qty * cart[item].price;
 }

 document.getElementById("total").innerText = total;
}

function placeOrder(){
 if(Object.keys(cart).length===0){
   alert("Cart is empty");
   return;
 }

 fetch("/food/order",{method:"POST"})
 .then(()=>{
   alert("Order placed successfully!");
   cart = {};
   updateCart();
 });
}

</script>

</body>
</html>
