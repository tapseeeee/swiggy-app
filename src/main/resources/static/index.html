<!DOCTYPE html>
<html>
<head>
<title>Swiggy Clone</title>

<style>
body {
    font-family: Arial;
    margin: 0;
    background: #f5f5f5;
}

header {
    background: #fc8019;
    color: white;
    padding: 15px;
    font-size: 22px;
    font-weight: bold;
}

.container {
    display: flex;
}

.menu {
    width: 70%;
    padding: 20px;
}

.cart {
    width: 30%;
    background: white;
    padding: 20px;
    box-shadow: -2px 0 5px rgba(0,0,0,0.1);
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.card {
    background: white;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    transition: 0.2s;
}

.card:hover {
    transform: translateY(-5px);
}

.card img {
    width: 100%;
    height: 140px;
    object-fit: cover;
}

.card-body {
    padding: 10px;
}

.price {
    color: green;
}

button {
    background: #fc8019;
    color: white;
    border: none;
    padding: 6px 10px;
    border-radius: 5px;
    cursor: pointer;
}

.qty button {
    margin: 0 3px;
}

</style>
</head>

<body>

<header>🍔 Swiggy Clone</header>

<div class="container">

<div class="menu">
    <button onclick="loadFood()">Show Menu</button>
    <div id="menu" class="grid"></div>
</div>

<div class="cart">
    <h3>🛒 Cart</h3>
    <div id="cartItems">No items</div>
    <h4>Total: ₹<span id="total">0</span></h4>
    <button onclick="placeOrder()">Place Order</button>
</div>

</div>

<script>

let cart = {};

const images = {
  Pizza: "https://images.unsplash.com/photo-1601924582975-7e8b1c4f1b3b",
  Burger: "https://images.unsplash.com/photo-1550547660-d9450f859349",
  Fries: "https://images.unsplash.com/photo-1585238342028-4d6d7f1e5c1d"
};

function loadFood(){
 fetch("/food")
 .then(res=>res.json())
 .then(data=>{
   let menu=document.getElementById("menu");
   menu.innerHTML="";

   data.forEach(item=>{
     let div=document.createElement("div");
     div.className="card";

     div.innerHTML=`
        <img src="${images[item.name]}" />
        <div class="card-body">
            <b>${item.name}</b><br>
            <span class="price">₹${item.price}</span><br><br>
            <button onclick="add('${item.name}', ${item.price})">Add</button>
        </div>
     `;

     menu.appendChild(div);
   });
 });
}

function add(name, price){
 if(!cart[name]) cart[name]={qty:0, price:price};
 cart[name].qty++;
 updateCart();
}

function remove(name){
 cart[name].qty--;
 if(cart[name].qty<=0) delete cart[name];
 updateCart();
}

function updateCart(){
 let cartDiv=document.getElementById("cartItems");
 cartDiv.innerHTML="";
 let total=0;

 if(Object.keys(cart).length === 0){
   cartDiv.innerHTML="No items";
 }

 for(let item in cart){
   let div=document.createElement("div");
   div.innerHTML=`
     ${item} x ${cart[item].qty}
     <button onclick="add('${item}', ${cart[item].price})">+</button>
     <button onclick="remove('${item}')">-</button>
   `;
   cartDiv.appendChild(div);

   total += cart[item].qty * cart[item].price;
 }

 document.getElementById("total").innerText = total;
}

function placeOrder(){
 if(Object.keys(cart).length === 0){
   alert("Cart is empty");
   return;
 }

 fetch("/food/order",{method:"POST"})
 .then(()=>{
   alert("Order placed successfully!");
   cart = {};
   updateCart();
 });
}

</script>

</body>
</html>
