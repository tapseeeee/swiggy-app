<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Food Delivery App</title>
<style>
body {
    font-family: Arial;
    margin: 0;
    background: #f5f5f5;
}

header {
    background: #ff4d4d;
    color: white;
    padding: 15px;
    display: flex;
    justify-content: space-between;
}

button {
    cursor: pointer;
}

.container {
    padding: 20px;
}

.restaurant {
    background: white;
    padding: 15px;
    margin: 15px;
    border-radius: 10px;
    width: 250px;
    display: inline-block;
    vertical-align: top;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}

.restaurant img {
    width: 100%;
    border-radius: 10px;
}

.menu-item {
    display: flex;
    justify-content: space-between;
    margin: 10px 0;
}

.cart {
    position: fixed;
    right: 0;
    top: 70px;
    width: 250px;
    background: white;
    padding: 15px;
    height: 100%;
    box-shadow: -2px 0 5px rgba(0,0,0,0.2);
}

.hidden {
    display: none;
}
</style>
</head>

<body>

<header>
    <h2>Food Delivery</h2>
    <div>
        <button onclick="login()">Login</button>
        <button onclick="logout()">Logout</button>
    </div>
</header>

<div class="container" id="restaurants"></div>

<div class="container hidden" id="menuSection">
    <h2 id="restaurantName"></h2>
    <div id="menu"></div>
</div>

<div class="cart">
    <h3>Cart</h3>
    <div id="cartItems"></div>
    <h4 id="total"></h4>
    <button onclick="checkout()">Checkout</button>
</div>

<script>
let userLoggedIn = false;

function login() {
    userLoggedIn = true;
    alert("Logged in");
}

function logout() {
    userLoggedIn = false;
    alert("Logged out");
}

const restaurants = [
    {
        name: "Pizza Palace",
        img: "https://source.unsplash.com/300x200/?pizza",
        menu: [
            {name: "Margherita", price: 200},
            {name: "Pepperoni", price: 250},
            {name: "Cheese Burst", price: 300}
        ]
    },
    {
        name: "Burger Hub",
        img: "https://source.unsplash.com/300x200/?burger",
        menu: [
            {name: "Veg Burger", price: 120},
            {name: "Chicken Burger", price: 180},
            {name: "Double Patty", price: 220}
        ]
    },
    {
        name: "Indian Kitchen",
        img: "https://source.unsplash.com/300x200/?indian-food",
        menu: [
            {name: "Paneer Butter Masala", price: 220},
            {name: "Biryani", price: 250},
            {name: "Dal Tadka", price: 150}
        ]
    }
];

let cart = [];

function loadRestaurants() {
    let container = document.getElementById("restaurants");
    container.innerHTML = "";

    restaurants.forEach((res, index) => {
        container.innerHTML += `
            <div class="restaurant">
                <img src="${res.img}">
                <h3>${res.name}</h3>
                <button onclick="viewMenu(${index})">View Menu</button>
            </div>
        `;
    });
}

function viewMenu(index) {
    let section = document.getElementById("menuSection");
    section.classList.remove("hidden");

    let res = restaurants[index];
    document.getElementById("restaurantName").innerText = res.name;

    let menuDiv = document.getElementById("menu");
    menuDiv.innerHTML = "";

    res.menu.forEach(item => {
        menuDiv.innerHTML += `
            <div class="menu-item">
                <span>${item.name} - ₹${item.price}</span>
                <button onclick="addToCart('${item.name}', ${item.price})">Add</button>
            </div>
        `;
    });
}

function addToCart(name, price) {
    if (!userLoggedIn) {
        alert("Login first!");
        return;
    }

    cart.push({name, price});
    renderCart();
}

function renderCart() {
    let cartDiv = document.getElementById("cartItems");
    cartDiv.innerHTML = "";

    let total = 0;

    cart.forEach(item => {
        cartDiv.innerHTML += `<p>${item.name} - ₹${item.price}</p>`;
        total += item.price;
    });

    document.getElementById("total").innerText = "Total: ₹" + total;
}

function checkout() {
    if (!userLoggedIn) {
        alert("Login first!");
        return;
    }

    if (cart.length === 0) {
        alert("Cart empty!");
        return;
    }

    alert("Order placed successfully!");
    cart = [];
    renderCart();
}

loadRestaurants();
</script>

</body>
</html>
