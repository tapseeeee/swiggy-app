<!DOCTYPE html>
<html>
<head>
<title>QuickBite - Food Delivery</title>

<style>
body {
    font-family: Arial;
    margin: 0;
    background: #f5f5f5;
}

header {
    background: #fc8019;
    color: white;
    padding: 15px;
    font-size: 22px;
}

.container {
    display: flex;
}

.restaurants, .menu {
    width: 70%;
    padding: 20px;
}

.cart {
    width: 30%;
    background: white;
    padding: 20px;
    height: 100vh;
    box-shadow: -2px 0 5px rgba(0,0,0,0.1);
}

/* CARD */
.card {
    background: white;
    padding: 15px;
    margin: 10px;
    border-radius: 10px;
    box-shadow: 0 5px 10px rgba(0,0,0,0.1);
    cursor: pointer;
}

.card:hover {
    background: #fff5ec;
}

button {
    background: #fc8019;
    color: white;
    border: none;
    padding: 6px 10px;
    border-radius: 5px;
    cursor: pointer;
    margin: 3px;
}

/* MENU ITEM */
.item {
    display: flex;
    justify-content: space-between;
    margin: 10px 0;
}
</style>
</head>

<body>

<header>🍔 QuickBite</header>

<div class="container">

<!-- RESTAURANTS -->
<div class="restaurants" id="restaurants"></div>

<!-- MENU -->
<div class="menu" id="menuSection" style="display:none;">
    <h2 id="resName"></h2>
    <button onclick="back()">⬅ Back</button>
    <div id="menu"></div>
</div>

<!-- CART -->
<div class="cart">
    <h3>🛒 Cart</h3>
    <div id="cartItems">No items</div>
    <h4>Total: ₹<span id="total">0</span></h4>
    <button onclick="clearCart()">Clear</button>
    <button onclick="placeOrder()">Place Order</button>
</div>

</div>

<script>

/* RESTAURANTS DATA */
const restaurants = [
{
    name: "Pizza Hub",
    menu: [
        {name: "Margherita", price: 200},
        {name: "Pepperoni", price: 250},
        {name: "Cheese Burst", price: 300},
        {name: "Farmhouse", price: 280}
    ]
},
{
    name: "Burger Palace",
    menu: [
        {name: "Veg Burger", price: 100},
        {name: "Chicken Burger", price: 150},
        {name: "Double Patty", price: 180},
        {name: "Cheese Burger", price: 160}
    ]
},
{
    name: "Snack Corner",
    menu: [
        {name: "Fries", price: 80},
        {name: "Loaded Fries", price: 120},
        {name: "Nachos", price: 140}
    ]
},
{
    name: "Indian Kitchen",
    menu: [
        {name: "Biryani", price: 250},
        {name: "Paneer Butter Masala", price: 220},
        {name: "Dal Tadka", price: 150},
        {name: "Roti Combo", price: 100}
    ]
}
];

let cart = {};

/* LOAD RESTAURANTS */
function loadRestaurants(){
    let div = document.getElementById("restaurants");
    div.innerHTML = "<h2>Restaurants</h2>";

    restaurants.forEach((r, i)=>{
        div.innerHTML += `
            <div class="card" onclick="openRestaurant(${i})">
                <b>${r.name}</b><br>
                ⭐ 4.${Math.floor(Math.random()*9)} | ⏱ 25 mins
            </div>
        `;
    });
}

/* OPEN MENU */
function openRestaurant(index){
    document.getElementById("restaurants").style.display="none";
    document.getElementById("menuSection").style.display="block";

    let res = restaurants[index];
    document.getElementById("resName").innerText = res.name;

    let menuDiv = document.getElementById("menu");
    menuDiv.innerHTML = "";

    res.menu.forEach(item=>{
        menuDiv.innerHTML += `
            <div class="item">
                <span>${item.name} - ₹${item.price}</span>
                <button onclick="add('${item.name}', ${item.price})">Add</button>
            </div>
        `;
    });
}

/* BACK */
function back(){
    document.getElementById("restaurants").style.display="block";
    document.getElementById("menuSection").style.display="none";
}

/* CART */
function add(name, price){
    if(!cart[name]) cart[name]={qty:0, price:price};
    cart[name].qty++;
    updateCart();
}

function remove(name){
    cart[name].qty--;
    if(cart[name].qty<=0) delete cart[name];
    updateCart();
}

function clearCart(){
    cart = {};
    updateCart();
}

function updateCart(){
    let div = document.getElementById("cartItems");
    div.innerHTML = "";
    let total = 0;

    if(Object.keys(cart).length === 0){
        div.innerHTML = "No items";
    }

    for(let item in cart){
        div.innerHTML += `
            ${item} x ${cart[item].qty}
            <button onclick="add('${item}', ${cart[item].price})">+</button>
            <button onclick="remove('${item}')">-</button>
            <br>
        `;
        total += cart[item].qty * cart[item].price;
    }

    document.getElementById("total").innerText = total;
}

/* PLACE ORDER */
function placeOrder(){
    if(Object.keys(cart).length === 0){
        alert("Cart is empty");
        return;
    }

    fetch("/food/order",{method:"POST"})
    .then(()=>{
        alert("Order placed successfully!");
        cart = {};
        updateCart();
    });
}

/* INIT */
loadRestaurants();

</script>

</body>
</html>
