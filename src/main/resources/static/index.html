<!DOCTYPE html>
<html>
<head>
<title>QuickBite Pro+</title>

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg,#0f0f0f,#1c1c1c);
    color: white;
}

/* HEADER */
header {
    background: #fc8019;
    padding: 15px 20px;
    display: flex;
    justify-content: space-between;
}

/* LOGIN */
.login {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.login-box {
    background: #1e1e1e;
    padding: 30px;
    border-radius: 10px;
}

/* LAYOUT */
.container { display: flex; }

.left { width: 70%; padding: 20px; }
.right { width: 30%; padding: 20px; background:#1a1a1a; }

/* CARD */
.card {
    background:#222;
    padding:15px;
    margin:10px 0;
    border-radius:10px;
    cursor:pointer;
}

.card:hover { background:#2a2a2a; }

/* BUTTON */
button {
    background:#fc8019;
    border:none;
    padding:6px 10px;
    color:white;
    border-radius:6px;
    cursor:pointer;
}

/* INPUT */
input {
    padding:8px;
    margin:5px;
    border-radius:5px;
    border:none;
}

/* STATUS COLORS */
.preparing { color:orange; }
.delivered { color:lightgreen; }

</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="login">
    <div class="login-box">
        <h2>Login</h2>
        <input id="username" placeholder="Enter Name"><br>
        <button onclick="login()">Enter App</button>
    </div>
</div>

<!-- APP -->
<div id="app" style="display:none">

<header>
    <span>🍔 QuickBite Pro+</span>
    <span id="user"></span>
</header>

<div class="container">

<div class="left" id="restaurants"></div>

<div class="left" id="menuSection" style="display:none;">
    <h2 id="resName"></h2>
    <button onclick="back()">⬅ Back</button>
    <div id="menu"></div>
</div>

<div class="right">
    <h3>Cart</h3>
    <div id="cart">No items</div>
    <h4>Total: ₹<span id="total">0</span></h4>
    <button onclick="placeOrder()">Place Order</button>

    <hr>

    <h3>Orders</h3>
    <div id="orders"></div>
</div>

</div>
</div>

<script>

let user = localStorage.getItem("user");

if(user){
    document.getElementById("loginPage").style.display="none";
    document.getElementById("app").style.display="block";
    document.getElementById("user").innerText=user;
}

function login(){
    let name=document.getElementById("username").value;
    localStorage.setItem("user",name);
    location.reload();
}

/* DATA */
const restaurants=[
{
name:"Pizza Hub",
menu:[
{name:"Margherita",price:200},
{name:"Pepperoni",price:250}
]
},
{
name:"Burger Palace",
menu:[
{name:"Veg Burger",price:100},
{name:"Chicken Burger",price:150}
]
}
];

let cart={};

/* LOAD */
function loadRestaurants(){
let div=document.getElementById("restaurants");
div.innerHTML="<h2>Restaurants</h2>";

restaurants.forEach((r,i)=>{
div.innerHTML+=`
<div class="card" onclick="openMenu(${i})">
${r.name}
</div>`;
});
}

function openMenu(i){
document.getElementById("restaurants").style.display="none";
document.getElementById("menuSection").style.display="block";

let r=restaurants[i];
document.getElementById("resName").innerText=r.name;

let m=document.getElementById("menu");
m.innerHTML="";

r.menu.forEach(item=>{
m.innerHTML+=`
<div class="card">
${item.name} - ₹${item.price}
<button onclick="add('${item.name}',${item.price})">Add</button>
</div>`;
});
}

function back(){
document.getElementById("restaurants").style.display="block";
document.getElementById("menuSection").style.display="none";
}

function add(name,price){
if(!cart[name]) cart[name]={qty:0,price};
cart[name].qty++;
updateCart();
}

function updateCart(){
let div=document.getElementById("cart");
div.innerHTML="";
let total=0;

for(let i in cart){
div.innerHTML+=`${i} x ${cart[i].qty}<br>`;
total+=cart[i].qty*cart[i].price;
}

document.getElementById("total").innerText=total;
if(Object.keys(cart).length===0) div.innerHTML="No items";
}

function placeOrder(){
if(Object.keys(cart).length===0){
alert("Cart empty");
return;
}

let total=document.getElementById("total").innerText;

let orders=JSON.parse(localStorage.getItem("orders")||"[]");

let order={
total,
status:"Preparing"
};

orders.push(order);
localStorage.setItem("orders",JSON.stringify(orders));

cart={};
updateCart();
loadOrders();

simulateStatus(orders.length-1);

alert("Order placed!");
}

function simulateStatus(index){
setTimeout(()=>{
let orders=JSON.parse(localStorage.getItem("orders"));
orders[index].status="Delivered";
localStorage.setItem("orders",JSON.stringify(orders));
loadOrders();
},5000);
}

function loadOrders(){
let div=document.getElementById("orders");
let orders=JSON.parse(localStorage.getItem("orders")||"[]");

div.innerHTML="";

orders.forEach((o,i)=>{
div.innerHTML+=`
<div class="card">
Order ₹${o.total}<br>
<span class="${o.status==='Delivered'?'delivered':'preparing'}">
${o.status}
</span>
<br>
<button onclick="reorder(${i})">Reorder</button>
</div>`;
});
}

function reorder(i){
let orders=JSON.parse(localStorage.getItem("orders"));
cart={"Reorder Item":{qty:1,price:orders[i].total}};
updateCart();
}

loadRestaurants();
loadOrders();

</script>

</body>
</html>
