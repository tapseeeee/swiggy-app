<!DOCTYPE html>
<html>
<head>
    <title>Swiggy Clone</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
        }

        header {
            background: #fc8019;
            color: white;
            padding: 15px;
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            padding: 20px;
        }

        button {
            background: #fc8019;
            color: white;
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: #e56f10;
        }

        .card {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .food-name {
            font-weight: bold;
            font-size: 18px;
        }

        .price {
            color: green;
        }
    </style>
</head>

<body>

<header>🍔 Swiggy Clone</header>

<div class="container">

    <button onclick="loadFood()">Show Menu</button>

    <div id="menu"></div>

</div>

<script>
function loadFood(){
 fetch("/food")
 .then(res => res.json())
 .then(data => {
   let menu = document.getElementById("menu");
   menu.innerHTML = "";

   data.forEach(item => {
     let div = document.createElement("div");
     div.className = "card";

     div.innerHTML = `
        <div>
            <div class="food-name">${item.name}</div>
            <div class="price">₹${item.price}</div>
        </div>
        <button onclick="orderItem()">Order</button>
     `;

     menu.appendChild(div);
   });
 });
}

function orderItem(){
 alert("Order placed successfully!");
}
</script>

</body>
</html>
